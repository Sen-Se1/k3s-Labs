apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-viewer-role
  namespace: task-app

rules:
  # Consultation des Pods
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  # Consultation des logs des Pods
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

  # Consultation des Services
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-viewer-binding
  namespace: task-app

subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: task-app

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-viewer-role