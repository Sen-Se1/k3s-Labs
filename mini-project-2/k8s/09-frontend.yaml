apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: task-app

data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://api-svc:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: task-app
  labels:
    app: taskmaster
    tier: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskmaster
      tier: frontend

  template:
    metadata:
      labels:
        app: taskmaster
        tier: frontend

    spec:
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: sen5e1/task-frontend:1.2
          imagePullPolicy: IfNotPresent

          command:
            - nginx

          args:
            - -g
            - daemon off;

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: task-app
  labels:
    app: taskmaster
    tier: frontend

spec:
  type: ClusterIP

  selector:
    app: taskmaster
    tier: frontend

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP