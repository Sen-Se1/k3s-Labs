networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  task-data:
    name: task-db-data

services:
  database:
    image: postgres:15-alpine
    container_name: task-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
      POSTGRES_USER: ${POSTGRES_USER:-taskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskpass}
    volumes:
      - task-data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./app/backend
    container_name: task-backend
    user: "1000:1000"
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-database}
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
      POSTGRES_USER: ${POSTGRES_USER:-taskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskpass}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${BACKEND_PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./app/frontend
    container_name: task-frontend
    user: "101:101"
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - API_URL=${API_URL:-http://backend:3000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${FRONTEND_PORT:-8080}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - frontend-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
